<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06100E"/>
      <stop offset="1" stop-color="#0A1814"/>
    </linearGradient>
    <linearGradient id="metro" x1="120" y1="760" x2="1460" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5963"/>
      <stop offset=".35" stop-color="#FFD257"/>
      <stop offset=".68" stop-color="#52B8FF"/>
      <stop offset="1" stop-color="#22D68A"/>
    </linearGradient>
    <linearGradient id="brt" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF744F"/>
      <stop offset="1" stop-color="#FF9C4A"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#g1)"/>
  <circle cx="1330" cy="120" r="180" fill="#22D68A" fill-opacity=".08" filter="url(#blur)"/>
  <circle cx="220" cy="560" r="210" fill="#FF5963" fill-opacity=".05" filter="url(#blur)"/>

  <!-- Tehran skyline -->
  <g opacity=".16" stroke="#BFD4CC" stroke-width="3" fill="none">
