    <rect x="30" y="20" width="180" height="34" rx="11" fill="#06100E" fill-opacity=".78"/>
    <circle cx="65" cy="79" r="9" fill="#F5FBF8"/><circle cx="176" cy="79" r="9" fill="#F5FBF8"/>
